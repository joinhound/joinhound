name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy --strict src/joinhound/core src/joinhound/engine
      - name: Pytest
        run: uv run pytest
      - name: Import contracts
        run: uv run lint-imports
      - name: Licenses
        run: uv run python scripts/check_licenses.py
      - name: Developer Certificate of Origin
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/check_dco.py
