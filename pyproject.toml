[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "joinhound"
version = "0.1.0"
description = "Find and traverse hidden relationships across databases and documents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Joinhound contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "azure-storage-blob==12.31.0",
    "datasketch==2.0.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "obstore==0.12.0",
    "openai==2.7.2",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg-pool==3.3.0",
    "psycopg[binary]==3.3.6",
    "pyahocorasick==2.2.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pymssql==2.3.8",
    "pypdfium2==5.14.0",
    "pytesseract==0.3.13",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.3",
    "tiktoken==0.12.0",
    "typer==0.27.3",
    "yoyo-migrations==9.0.0",
]

[project.urls]
Homepage = "https://joinhound.dev"
Repository = "https://github.com/joinhound/joinhound"
Issues = "https://github.com/joinhound/joinhound/issues"

[project.scripts]
joinhound = "joinhound.cli:app"
jh = "joinhound.cli:app"

[project.entry-points."joinhound.embedders"]
local = "joinhound.llm.hashing:HashEmbedder"
none = "joinhound.llm.none:NoneEmbedder"
openai = "joinhound.llm.openai_embedder:OpenAIEmbedder"

[project.entry-points."joinhound.judges"]
none = "joinhound.llm.none:NoneJudge"
openai = "joinhound.llm.openai_judge:OpenAIJudge"

[project.entry-points."joinhound.ocr"]
tesseract = "joinhound.ocr:TesseractOcrEngine"

[project.entry-points."joinhound.parsers"]
docx = "joinhound.parsers:DocxParser"
html = "joinhound.parsers:HtmlParser"
pdf = "joinhound.parsers:PdfParser"

[project.entry-points."joinhound.auth"]
bearer = "joinhound.server.auth:StaticTokenVerifier"

[project.entry-points."joinhound.connectors"]
azure = "joinhound.connectors.azure:AzureSource"
mssql = "joinhound.connectors.mssql:MssqlSource"
postgres = "joinhound.connectors.postgres:PostgresSource"
s3 = "joinhound.connectors.s3:S3Source"

[project.entry-points."joinhound.matchers"]
column_documents = "joinhound.matchers:DocumentMatcher"
declared_fk = "joinhound.matchers:DeclaredFkMatcher"
exact = "joinhound.matchers:ExactMatcher"
fuzzy = "joinhound.matchers:FuzzyMatcher"
normalized = "joinhound.matchers:NormalizedMatcher"
semantic = "joinhound.matchers:SemanticMatcher"

[project.entry-points."joinhound.model_formats"]
ossie = "joinhound.formats:OssieFormat"

[tool.hatch.build.targets.wheel.force-include]
"migrations/0001.kg.sql" = "joinhound/migrations/0001.kg.sql"
"migrations/0001.kg.rollback.sql" = "joinhound/migrations/0001.kg.rollback.sql"
"migrations/0002.value_sync.sql" = "joinhound/migrations/0002.value_sync.sql"
"migrations/0002.value_sync.rollback.sql" = "joinhound/migrations/0002.value_sync.rollback.sql"
"migrations/0003.judge_cache.sql" = "joinhound/migrations/0003.judge_cache.sql"
"migrations/0003.judge_cache.rollback.sql" = "joinhound/migrations/0003.judge_cache.rollback.sql"
"migrations/0004.embedding_model.sql" = "joinhound/migrations/0004.embedding_model.sql"
"migrations/0004.embedding_model.rollback.sql" = "joinhound/migrations/0004.embedding_model.rollback.sql"
"src/joinhound/formats/ossie-schema.json" = "joinhound/formats/ossie-schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "testcontainers==4.15.0",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.importlinter]
root_packages = ["joinhound"]

[[tool.importlinter.contracts]]
name = "Core does not depend on other components"
type = "forbidden"
source_modules = ["joinhound.core"]
forbidden_modules = [
    "joinhound.cli",
    "joinhound.connectors",
    "joinhound.engine",
    "joinhound.formats",
    "joinhound.index",
    "joinhound.llm",
    "joinhound.matchers",
    "joinhound.ocr",
    "joinhound.parsers",
    "joinhound.profiler",
    "joinhound.server",
    "joinhound.telemetry",
]

[[tool.importlinter.contracts]]
name = "Connectors, index, and profiler are independent"
type = "independence"
modules = [
    "joinhound.connectors",
    "joinhound.index",
    "joinhound.profiler",
]

[[tool.importlinter.contracts]]
name = "Connectors, index, and profiler depend only on core"
type = "forbidden"
source_modules = [
    "joinhound.connectors",
    "joinhound.index",
    "joinhound.profiler",
]
forbidden_modules = [
    "joinhound.cli",
    "joinhound.engine",
    "joinhound.formats",
    "joinhound.llm",
    "joinhound.matchers",
    "joinhound.ocr",
    "joinhound.parsers",
    "joinhound.server",
    "joinhound.telemetry",
]

[[tool.importlinter.contracts]]
name = "Parsers and OCR depend only on core"
type = "forbidden"
source_modules = [
    "joinhound.ocr",
    "joinhound.parsers",
]
forbidden_modules = [
    "joinhound.cli",
    "joinhound.connectors",
    "joinhound.engine",
    "joinhound.formats",
    "joinhound.index",
    "joinhound.llm",
    "joinhound.matchers",
    "joinhound.profiler",
    "joinhound.server",
    "joinhound.telemetry",
]

[[tool.importlinter.contracts]]
name = "Engine depends only on core and index"
type = "forbidden"
source_modules = ["joinhound.engine"]
forbidden_modules = [
    "joinhound.cli",
    "joinhound.connectors",
    "joinhound.formats",
    "joinhound.llm",
    "joinhound.matchers",
    "joinhound.ocr",
    "joinhound.parsers",
    "joinhound.profiler",
    "joinhound.server",
    "joinhound.telemetry",
]
