[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "joinhound"
version = "0.0.1"
description = "Find and traverse hidden relationships across databases and documents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Joinhound contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer==0.27.3",
]

[project.urls]
Homepage = "https://joinhound.dev"
Repository = "https://github.com/joinhound/joinhound"
Issues = "https://github.com/joinhound/joinhound/issues"

[project.scripts]
joinhound = "joinhound.cli:app"
jh = "joinhound.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
